<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportForm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>

<body>

    <form id="reportForm">
        <input type="text" name="data[Name]" placeholder="ชื่อ" required>
        <input type="email" name="data[Email]" placeholder="อีเมล" required>
        <select class="form-select" aria-label="Default select example">
            <option selected>Open this select menu</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
        </select>
        <button type="submit">ส่งข้อมูล</button>
    </form>

</body>
<script>
    var form = document.getElementById('reportForm');
    form.addEventListener("submit", e => {
        e.preventDefault(); // ป้องกันหน้าจอรีเฟรช

        fetch('https://sheetdb.io/api/v1/xty1919lzmge6', {
            method: 'POST',
            body: new FormData(document.getElementById("reportForm")),
        }).then(
            response => response.json()
        ).then((html) => {
            // เมื่อส่งสำเร็จ ให้ทำอะไรต่อ?
            alert('ส่งข้อมูลสำเร็จแล้ว!');
        });
    });
</script>

</html>
