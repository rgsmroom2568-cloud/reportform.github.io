<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportForm - Styled</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
    font-family: 'Kanit', sans-serif;
    background-color: #f8f9fa;
}

.form-container {
    max-width: 600px;
    margin-top: 50px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}


@media (max-width: 400px) {
    .form-container {
        max-width: 400px;
        margin-top: 30px;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
}
    </style>
</head>

<body>

    <div class="container-sm d-flex justify-content-center">
        <div class="form-container w-70">
            <h2 class="mb-4 text-center">แบบฟอร์มรายงาน</h2>
            <form id="reportForm">
                <div class="mb-3">
                    <label class="form-label">ชื่อผู้ตรวจ</label>
                    <input type="text" class="form-control" name="data[Name]" placeholder="ระบุชื่อ-นามสกุล" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">แผนก</label>
                    <input type="text" class="form-control" name="data[Department]" placeholder="ระบุแผนก" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">สถานที่</label>
                    <input type="text" class="form-control" name="data[Location]" placeholder="ระบุสถานที่" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">สภาพเครื่องคอมพิวเตอร์</label>
                    <input type="text" class="form-control" name="data[PC_Condition]" placeholder="ระบุสภาพเครื่อง"
                        required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">สถานะพัดลม</label>
                        <input type="text" class="form-control" name="data[Fan]" placeholder="ปกติ/ผิดปกติ" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">เสียงตัวเครื่อง</label>
                        <input type="text" class="form-control" name="data[Noise]" placeholder="มีเสียง/ไม่มีเสียง"
                            required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">ระดับฝุ่น</label>
                    <select class="form-select" name="data[Dirt_Level]" required>
                        <option value="" selected disabled>กรุณาเลือกระดับของฝุ่น</option>
                        <option value="สะอาด">สะอาด</option>
                        <option value="มีฝุ่นเล็กน้อย">มีฝุ่นเล็กน้อย</option>
                        <option value="มีฝุ่นมาก">มีฝุ่นมาก</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">คอมพิวเตอร์ช้าหรือค้างหรือไม่</label>
                    <input type="text" class="form-control" name="data[Lagging]">
                </div>

                <div class="mb-3">
                    <label class="form-label">วันประชุม</label>
                    <input type="date" name="data[Date]" class="form-control mb-3" required>
                </div>

                <div class="mb-3">
                    <label for="cameraInput" class="form-label">รูปถ่ายเครื่องคอมพิวเตอร์</label>
                    <input type="file" class="form-control" id="cameraInput" name="data[Picture]" accept="image/*"
                        capture="camera">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">ส่งข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ฟังก์ชันบีบอัดรูปภาพให้ขนาดเล็กลงก่อนส่ง
        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; // ตั้งค่าความกว้างสูงสุดที่ต้องการ
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        // แปลงเป็น Base64 โดยลดคุณภาพลงเหลือ 0.7 (70%)
                        const base64 = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(base64);
                    };
                };
            });
        };

        var form = document.getElementById('reportForm');
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            // แสดง Loading หรือปิดปุ่มกดเพื่อป้องกันการกดซ้ำ
            const submitBtn = e.target.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังส่งข้อมูล...';

            var formData = new FormData(form);
            const now = new Date();
            const timestamp = now.toLocaleString('th-TH');

            const fileInput = document.getElementById('cameraInput');
            const file = fileInput.files[0];

            if (file) {
                // ใช้ฟังก์ชันบีบอัดภาพแทน toBase64 ตัวเดิม
                const compressedBase64 = await compressImage(file);
                formData.set('data[Picture]', compressedBase64);
            }

            formData.append('data[TimeStamp]', timestamp);

            fetch('https://sheetdb.io/api/v1/xty1919lzmge6', {
                method: 'POST',
                body: formData,
            })
                .then(response => response.json())
                .then(data => {
                    alert('บันทึกข้อมูลเรียบร้อย!');
                    form.reset();
                })
                .catch(err => {
                    console.error(err);
                    alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'ส่งข้อมูล';
                });
        });
    </script>
</body>

</html>
