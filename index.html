<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">

    <link rel="icon" sizes="192x192" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">
    <link rel="icon" sizes="512x512" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">

    <meta name="apple-mobile-web-app-title" content="ReportForm">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportForm - Styled</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">

    <style>
        /* สไตล์สำหรับ Card Container ที่ใช้ Grid ของ Bootstrap */
        .card-container {
            margin-top: 10px;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* สไตล์ Card สำหรับลูกเล่นเงา/เด้ง */
        .custom-card {
            text-align: center;
            /* ลบ padding เดิมออกเพื่อให้รูปภาพขยายเต็ม */
            padding: 5px;
            /* เพิ่ม padding เล็กน้อยเพื่อให้มีขอบรอบรูป */
            transition: all 0.3s ease-in-out;
            cursor: pointer;
            border: none;
            height: 100%;
            opacity: 95%;
        }

        /* ลูกเล่น: เงาเข้มขึ้นและเด้งขึ้นเมื่อเมาส์ชี้ */
        .card-link:hover .custom-card {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2) !important;
            transform: translateY(-8px);
        }

        /* สไตล์สำหรับลิงก์ที่หุ้ม Card */
        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }

        /* ************************************************** */
        /* NEW: Wrapper ที่กำหนดความสูงและควบคุมการจัดรูปภาพ */
        /* ************************************************** */
        .card-img-wrapper {
            height: 180px;
            /* เพิ่มความสูงของ Wrapper เพื่อรองรับรูปภาพที่ใหญ่ขึ้น */
            display: flex;
            align-items: center;
            justify-content: center;
            /* ไม่มี margin-bottom เพราะไม่มีหัวข้อแล้ว */
        }

        /* สไตล์ของรูปภาพภายใน Wrapper */
        .card-img-wrapper img {
            width: 100%;
            /* ทำให้รูปภาพยืดเต็มความกว้างของ Card-Wrapper */
            max-width: 180px;
            /* กำหนดขนาดสูงสุดของรูปภาพในแนวตั้ง */
            height: auto;
            display: block;
            margin: 0;
            /* ใช้ object-fit: contain; เพื่อให้แน่ใจว่ารูปภาพจะไม่ถูกตัด แต่จะถูกปรับขนาดให้พอดีกับพื้นที่ Wrapper */
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div class="container-sm">
        <div class="cc-center">
            <h1>RGS Computer</h1>
            <H2>Report Form</H2>
        </div>

        <div class="col card-container">
            <a href="form.html" class="card-link" title="Cassavaplus / RGE">
                <div class="card custom-card shadow-sm rounded">
                    <div class="card-img-wrapper">
                        <h1>Form Report</h1>
                    </div>
                </div>
            </a>
        </div>

        <div class="col card-container">
            <a href="wiuser.html" class="card-link" title="Cassavaplus / RGE">
                <div class="card custom-card shadow-sm rounded">
                    <div class="card-img-wrapper">
                        <h1>คู่มือเบื้องต้นของการใช้งานและแก้ปัญหาคอมพิวเตอร์</h1>
                    </div>
                </div>
            </a>
        </div>

    </div>
</body>

</html>
