<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">

    <link rel="icon" sizes="192x192" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">
    <link rel="icon" sizes="512x512" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">

    <meta name="apple-mobile-web-app-title" content="ReportForm">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportForm - Computer</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">

    <style>
        /* Custom aesthetics for form */
        .submit-btn {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            transition: transform 0.2s;
        }
        .submit-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }
        .camera-btn-wrapper {
            background: rgba(255, 255, 255, 0.5);
            border: 2px dashed #0d6efd;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            transition: background 0.3s;
        }
        .camera-btn-wrapper:hover {
            background: rgba(13, 110, 253, 0.1);
        }
        .form-floating label {
            color: #6c757d;
        }
        .form-floating>.form-control:focus~label,
        .form-floating>.form-control:not(:placeholder-shown)~label {
            color: #0d6efd;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container-sm d-flex justify-content-center">
        <div class="form-container w-100 mx-3">
            <div class="text-center mb-4">
                <i class="fa-solid fa-desktop fa-3x text-primary mb-3"></i>
                <h2>แบบฟอร์มรายงานคอมพิวเตอร์</h2>
                <p class="text-muted">กรุณากรอกข้อมูลเพื่อแจ้งสถานะของอุปกรณ์</p>
            </div>
            
            <form id="reportForm">
                
                <div class="form-floating mb-3 shadow-sm rounded">
                    <input type="text" class="form-control" id="inputName" name="data[Name]" placeholder="ระบุชื่อ-นามสกุล" required>
                    <label for="inputName"><i class="fa-solid fa-user me-2"></i>ชื่อผู้ตรวจ</label>
                </div>
                
                <div class="form-floating mb-3 shadow-sm rounded">
                    <input type="text" class="form-control" id="inputDept" name="data[Department]" placeholder="ระบุแผนก" required>
                    <label for="inputDept"><i class="fa-solid fa-sitemap me-2"></i>แผนก</label>
                </div>
                
                <div class="form-floating mb-3 shadow-sm rounded">
                    <input type="text" class="form-control" id="inputLoc" name="data[Location]" placeholder="ระบุสถานที่" required>
                    <label for="inputLoc"><i class="fa-solid fa-location-dot me-2"></i>สถานที่</label>
                </div>
                
                <div class="form-floating mb-3 shadow-sm rounded">
                    <input type="text" class="form-control" id="inputCondition" name="data[PC_Condition]" placeholder="ระบุสภาพเครื่อง" required>
                    <label for="inputCondition"><i class="fa-solid fa-computer me-2"></i>สภาพเครื่องคอมพิวเตอร์</label>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <div class="form-floating shadow-sm rounded">
                            <input type="text" class="form-control" id="inputFan" name="data[Fan]" placeholder="ปกติ/ผิดปกติ" required>
                            <label for="inputFan"><i class="fa-solid fa-fan me-2"></i>สถานะพัดลม</label>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-floating shadow-sm rounded">
                            <input type="text" class="form-control" id="inputNoise" name="data[Noise]" placeholder="มีเสียง/ไม่มีเสียง" required>
                            <label for="inputNoise"><i class="fa-solid fa-volume-high me-2"></i>เสียงตัวเครื่อง</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mb-3 shadow-sm rounded">
                    <select class="form-select" id="selectDirt" name="data[Dirt_Level]" required>
                        <option value="" selected disabled>กรุณาเลือกระดับของฝุ่น</option>
                        <option value="สะอาด">สะอาด</option>
                        <option value="มีฝุ่นเล็กน้อย">มีฝุ่นเล็กน้อย</option>
                        <option value="มีฝุ่นมาก">มีฝุ่นมาก</option>
                    </select>
                    <label for="selectDirt"><i class="fa-solid fa-broom me-2"></i>ระดับฝุ่น</label>
                </div>

                <div class="form-floating mb-3 shadow-sm rounded">
                    <input type="text" class="form-control" id="inputLag" name="data[Lagging]" placeholder="ช้าหรือค้างหรือไม่">
                    <label for="inputLag"><i class="fa-solid fa-gauge-simple-high me-2"></i>คอมพิวเตอร์ช้าหรือค้างหรือไม่</label>
                </div>

                <div class="form-floating mb-4 shadow-sm rounded">
                    <input type="date" class="form-control" id="inputDate" name="data[Date]" required>
                    <label for="inputDate"><i class="fa-regular fa-calendar-check me-2"></i>วันที่บันทึก</label>
                </div>

                <div class="mb-4 camera-btn-wrapper shadow-sm">
                    <label for="cameraInput" class="form-label fw-bold text-primary mb-2">
                        <i class="fa-solid fa-camera fa-lg me-2"></i>รูปถ่ายเครื่องคอมพิวเตอร์
                    </label>
                    <input type="file" class="form-control" id="cameraInput" name="data[Picture]" accept="image/*" capture="camera">
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn submit-btn btn-lg shadow rounded-pill fw-bold">
                        <i class="fa-solid fa-paper-plane me-2"></i>ส่งข้อมูลรายงาน
                    </button>
                    <!-- ปุ่มกลับหน้าแรก -->
                    <a href="index.html" class="btn btn-outline-secondary rounded-pill mt-3 shadow-sm">
                        <i class="fa-solid fa-arrow-left me-2"></i>กลับเมนูหลัก
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ฟังก์ชันบีบอัดรูปภาพให้ขนาดเล็กลงก่อนส่ง
        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');

                        // ปรับ MAX_WIDTH ลงเหลือ 300
                        const MAX_WIDTH = 300;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        // ปรับคุณภาพ (Quality) ลงเหลือ 0.1 (10%)
                        const base64 = canvas.toDataURL('image/jpeg', 0.1);

                        if (base64.length > 50000) {
                            alert("รูปภาพยังมีขนาดใหญ่เกินไป กรุณาลองถ่ายใหม่อีกครั้ง");
                        }

                        resolve(base64);
                    };
                };
            });
        };

        var form = document.getElementById('reportForm');
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>กำลังส่งข้อมูล...';

            // 1. ดึงค่าจาก Form มาสร้างเป็น Object ปกติ
            const fd = new FormData(form);
            const payload = {};

            // แปลงชื่อจาก data[Name] ให้เหลือแค่ Name เพื่อให้ตรงกับหัวตารางใน Google Sheets
            fd.forEach((value, key) => {
                const cleanKey = key.replace('data[', '').replace(']', '');
                payload[cleanKey] = value;
            });

            // 2. จัดการเรื่องรูปภาพ (บีบอัด)
            const fileInput = document.getElementById('cameraInput');
            const file = fileInput.files[0];
            if (file) {
                const compressedBase64 = await compressImage(file);
                payload['Picture'] = compressedBase64;
            }

            // 3. เพิ่ม TimeStamp
            const now = new Date();
            payload['TimeStamp'] = now.toLocaleString('th-TH');

            // 4. ส่งข้อมูลแบบ JSON (SheetDB)
            fetch('https://sheetdb.io/api/v1/xty1919lzmge6', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    data: [payload]
                }),
            })
                .then(response => response.json())
                .then(data => {
                    if (data.created) {
                        alert('บันทึกข้อมูลเรียบร้อย!');
                        form.reset();
                    } else {
                        alert('เกิดข้อผิดพลาด: ' + JSON.stringify(data));
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                });
        });
    </script>
</body>

</html>
