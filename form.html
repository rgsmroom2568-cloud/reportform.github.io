<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">

    <link rel="icon" sizes="192x192" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">
    <link rel="icon" sizes="512x512" href="https://cdn.jsdelivr.net/gh/rgsmroom2568-cloud/images/rge.png">

    <meta name="apple-mobile-web-app-title" content="ReportForm">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportForm - Computer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container-sm d-flex justify-content-center">
        <div class="form-container w-70">
            <h2 class="mb-4 text-center">แบบฟอร์มรายงานคอมพิวเตอร์</h2>
            <form id="reportForm">
                <div class="mb-3">
                    <label class="form-label">ชื่อผู้ตรวจ</label>
                    <input type="text" class="form-control" name="data[Name]" placeholder="ระบุชื่อ-นามสกุล" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">แผนก</label>
                    <input type="text" class="form-control" name="data[Department]" placeholder="ระบุแผนก" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">สถานที่</label>
                    <input type="text" class="form-control" name="data[Location]" placeholder="ระบุสถานที่" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">สภาพเครื่องคอมพิวเตอร์</label>
                    <input type="text" class="form-control" name="data[PC_Condition]" placeholder="ระบุสภาพเครื่อง"
                        required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">สถานะพัดลม</label>
                        <input type="text" class="form-control" name="data[Fan]" placeholder="ปกติ/ผิดปกติ" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">เสียงตัวเครื่อง</label>
                        <input type="text" class="form-control" name="data[Noise]" placeholder="มีเสียง/ไม่มีเสียง"
                            required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">ระดับฝุ่น</label>
                    <select class="form-select" name="data[Dirt_Level]" required>
                        <option value="" selected disabled>กรุณาเลือกระดับของฝุ่น</option>
                        <option value="สะอาด">สะอาด</option>
                        <option value="มีฝุ่นเล็กน้อย">มีฝุ่นเล็กน้อย</option>
                        <option value="มีฝุ่นมาก">มีฝุ่นมาก</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">คอมพิวเตอร์ช้าหรือค้างหรือไม่</label>
                    <input type="text" class="form-control" name="data[Lagging]">
                </div>

                <div class="mb-3">
                    <label class="form-label">วันที่บันทึก</label>
                    <input type="date" name="data[Date]" class="form-control mb-3" required>
                </div>

                <div class="mb-3">
                    <label for="cameraInput" class="form-label">รูปถ่ายเครื่องคอมพิวเตอร์</label>
                    <input type="file" class="form-control" id="cameraInput" name="data[Picture]" accept="image/*"
                        capture="camera">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">ส่งข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ฟังก์ชันบีบอัดรูปภาพให้ขนาดเล็กลงก่อนส่ง
        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');

                        // ปรับ MAX_WIDTH ลงเหลือ 400 (พอชัดสำหรับดูในตาราง)
                        const MAX_WIDTH = 300;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        // ปรับคุณภาพ (Quality) ลงเหลือ 0.4 (40%)
                        // ค่านี้จะช่วยให้รหัส Base64 สั้นลงอย่างมาก
                        const base64 = canvas.toDataURL('image/jpeg', 0.1);

                        // เช็คความยาวก่อนส่ง ถ้ายังเกิน 50,000 ให้แจ้งเตือน
                        if (base64.length > 50000) {
                            alert("รูปภาพยังมีขนาดใหญ่เกินไป กรุณาลองถ่ายใหม่อีกครั้ง");
                        }

                        resolve(base64);
                    };
                };
            });
        };

        var form = document.getElementById('reportForm');
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังส่งข้อมูล...';

            // 1. ดึงค่าจาก Form มาสร้างเป็น Object ปกติ
            const fd = new FormData(form);
            const payload = {};

            // แปลงชื่อจาก data[Name] ให้เหลือแค่ Name เพื่อให้ตรงกับหัวตารางใน Google Sheets
            fd.forEach((value, key) => {
                const cleanKey = key.replace('data[', '').replace(']', '');
                payload[cleanKey] = value;
            });

            // 2. จัดการเรื่องรูปภาพ (บีบอัด)
            const fileInput = document.getElementById('cameraInput');
            const file = fileInput.files[0];
            if (file) {
                const compressedBase64 = await compressImage(file);
                payload['Picture'] = compressedBase64;
            }

            // 3. เพิ่ม TimeStamp
            const now = new Date();
            payload['TimeStamp'] = now.toLocaleString('th-TH');

            // 4. ส่งข้อมูลแบบ JSON (SheetDB แนะนำวิธีนี้)
            fetch('https://sheetdb.io/api/v1/xty1919lzmge6', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    data: [payload] // ต้องหุ้มด้วย data และใส่ใน Array []
                }),
            })
                .then(response => response.json())
                .then(data => {
                    if (data.created) { // ตรวจสอบว่าสำเร็จไหม
                        alert('บันทึกข้อมูลเรียบร้อย!');
                        form.reset();
                    } else {
                        alert('เกิดข้อผิดพลาด: ' + JSON.stringify(data));
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'ส่งข้อมูล';
                });
        });
    </script>
</body>

</html>
